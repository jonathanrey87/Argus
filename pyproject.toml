[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astranyx-engine"
version = "4.0.0a2"
description = "Astranyx Investigation Engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Jonathan Mendiola" }
]
keywords = [
    "security",
    "static-analysis",
    "sast",
    "threat-intelligence",
    "wordpress",
    "sarif"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.optional-dependencies]
ios = ["pymobiledevice3"]
telemetry = [
	"arize-otel>=0.13.0,<0.14",
	"opentelemetry-api>=1.44.0,<2",
]

[project.urls]
Homepage = "https://github.com/jonathanrey87/Astranyx"
Repository = "https://github.com/jonathanrey87/Astranyx"
Issues = "https://github.com/jonathanrey87/Astranyx/issues"

[project.scripts]
astranyx = "astranyx.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["astranyx", "astranyx.*"]
exclude = [
    "tests",
    "tests.*",
    "docs",
    "docs.*",
    "docs1",
    "docs1.*",
    "tests1",
    "tests1.*",
    "reports",
    "reports.*",
    "evidence",
    "evidence.*",
    "playbooks",
    "playbooks.*",
    "investigations",
    "investigations.*"
]

[tool.setuptools.package-data]
"astranyx.core" = [
    "templates/*.html",
    "templates/*.css",
    "templates/*.js"
]
"astranyx" = ["schemas/*.json"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
required-version = "==0.16.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
